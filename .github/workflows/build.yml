name: Build OkayOS ISO

# Builds the live ISO on every push and uploads it as a downloadable artifact.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            live-build debootstrap debian-archive-keyring \
            xorriso squashfs-tools isolinux syslinux-common syslinux-utils \
            mtools dosfstools curl ca-certificates imagemagick fonts-dejavu-core

      - name: Build ISO
        run: |
          sudo scripts/build-native.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: OkayOS-amd64
          path: out/OkayOS-amd64.iso
          if-no-files-found: error
